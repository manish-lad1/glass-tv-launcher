<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone companion</title>

</head>
<body>
<div class="x-dc">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:20px}
.lb{font-size:13px;font-weight:500;color:rgba(255,255,255,.75)}
.in{font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:11px 12px;width:100%;box-sizing:border-box}
.in::placeholder{color:rgba(255,255,255,.55)}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:rgba(255,255,255,.7);background:none;border:0;padding:6px 0;min-width:64px}
button{font:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #12102a; font-family: Inter, system-ui, sans-serif; color: #ffffff">

<header style="padding: 54px 20px 14px; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: rgba(255,255,255,.75)">Glass Launcher</span>
<span style="font-size: 20px; font-weight: 600">Living room TV</span>
</div>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; background: rgba(110,220,160,.16); color: #9ef0c2; padding: 6px 10px; border-radius: 999px"><span style="width: 7px; height: 7px; border-radius: 999px; background: #6edca0"></span>Connected</span>
</header>

<main style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.5px">Now watching</h1>

<form class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lb">Title</span><input class="in" type="text" placeholder="Show or film"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lb">Opens in</span><select class="in"><option>JioHotstar</option><option>Netflix</option><option>Prime Video</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lb">Up to</span><input class="in" type="text" placeholder="S1 E1"></label>
</div>
<button type="submit" style="margin-top: 2px; border: 0; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; background: #ffffff; color: #16132e">Add to TV</button>
</form>

<div class="card" style="display: flex; flex-direction: column">
<div class="row"><div style="width: 64px; height: 40px; border-radius: 8px; background: #24345e; flex: none"></div><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 15px; font-weight: 600">The Long Field</span><span style="font-size: 12px; color: rgba(255,255,255,.75)">Netflix · S2 E5 · 24m left</span><div style="height: 3px; border-radius: 999px; background: rgba(255,255,255,.2)"><div style="width: 62%; height: 3px; border-radius: 999px; background: #fff"></div></div></div><button aria-label="Options for The Long Field" style="background: none; border: 0; color: #fff; font-size: 20px; padding: 8px">⋯</button></div>
<div style="height: 1px; background: rgba(255,255,255,.1); margin: 0 14px"></div>
<div class="row"><div style="width: 64px; height: 40px; border-radius: 8px; background: #6b4058; flex: none"></div><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 15px; font-weight: 600">Harbour Lights</span><span style="font-size: 12px; color: rgba(255,255,255,.75)">Prime Video · Film · 1h 10m left</span><div style="height: 3px; border-radius: 999px; background: rgba(255,255,255,.2)"><div style="width: 28%; height: 3px; border-radius: 999px; background: #fff"></div></div></div><button aria-label="Options for Harbour Lights" style="background: none; border: 0; color: #fff; font-size: 20px; padding: 8px">⋯</button></div>
<div style="height: 1px; background: rgba(255,255,255,.1); margin: 0 14px"></div>
<div class="row"><div style="width: 64px; height: 40px; border-radius: 8px; background: #2f5a4c; flex: none"></div><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 15px; font-weight: 600">Quiet Orbit</span><span style="font-size: 12px; color: rgba(255,255,255,.75)">JioHotstar · Queued · not started</span></div><button aria-label="Options for Quiet Orbit" style="background: none; border: 0; color: #fff; font-size: 20px; padding: 8px">⋯</button></div>
</div>
<span style="font-size: 12px; color: rgba(255,255,255,.7); text-align: center">The first two show on the TV. Drag to reorder.</span>
</main>

<nav aria-label="Sections" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 30px; display: flex; justify-content: space-around; background: rgba(18,16,42,.92); border-top: 1px solid rgba(255,255,255,.12)">
<button class="tab" style="color: #ffffff"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M10 8.5v5l4-2.5z"></path></svg>Watching</button>
<button class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="14" width="5" height="5" rx="1.2"></rect><rect x="9.5" y="14" width="5" height="5" rx="1.2"></rect><rect x="16" y="14" width="5" height="5" rx="1.2"></rect></svg>Dock</button>
<button class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M3 16l5-4.5 4 3.5 3-2.5 6 4.5"></path></svg>Wallpapers</button>
<button class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Calendar</button>
</nav>
</div>
</div>

</body>
</html>
