<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dock edit mode</title>

</head>
<body>
<div class="x-dc">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.g{position:relative;overflow:hidden;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(36px) saturate(170%);backdrop-filter:blur(36px) saturate(170%);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 24px 60px rgba(8,6,24,.35)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 42%);pointer-events:none}
.t{width:176px;height:104px;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:0}
.s{position:relative;flex:none}
.x{position:absolute;top:-12px;left:-12px;width:34px;height:34px;border-radius:999px;background:rgba(30,26,60,.92);border:1px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;z-index:2}
.kk{font-size:20px;font-weight:600;color:#16132e;background:rgba(255,255,255,.92);border-radius:10px;padding:6px 12px}
.kv{font-size:22px;color:rgba(255,255,255,.88)}
button{font:inherit;color:inherit;cursor:pointer}
</style>

<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0b1026; font-family: Inter, system-ui, sans-serif; color: #ffffff">
<svg aria-hidden="true" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%">
<defs><linearGradient id="skye" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1026"></stop><stop offset=".42" stop-color="#1c2856"></stop><stop offset=".66" stop-color="#5a447a"></stop><stop offset=".84" stop-color="#d48a6c"></stop><stop offset="1" stop-color="#f0b07a"></stop></linearGradient></defs>
<rect width="1920" height="1080" fill="url(#skye)"></rect>
<path d="M0 700 L180 612 L320 662 L520 540 L700 640 L880 580 L1060 650 L1240 560 L1420 640 L1600 590 L1780 650 L1920 610 L1920 860 L0 860Z" fill="#4a3f6e" opacity=".85"></path>
<path d="M0 770 L240 668 L420 742 L640 642 L860 762 L1080 692 L1300 772 L1520 682 L1740 762 L1920 702 L1920 900 L0 900Z" fill="#2a2350"></path>
<path d="M0 890 L300 802 L560 862 L820 782 L1100 872 L1400 802 L1700 882 L1920 832 L1920 1080 L0 1080Z" fill="#14102b"></path>
</svg>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6,6,20,.55)"></div>

<div style="position: absolute; left: 120px; right: 120px; top: 96px; display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 56px; font-weight: 300; letter-spacing: -1px">Editing dock</h1>
<span style="font-size: 24px; color: rgba(255,255,255,.78)">Widgets are hidden while you edit. 7 of 8 slots used.</span>
</div>
<div class="g" style="border-radius: 999px; padding: 14px 26px; font-size: 22px; font-weight: 500">Done</div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 470px; display: flex; flex-direction: column; align-items: center; gap: 34px">
<div style="font-size: 24px; font-weight: 500">Moving <b>JioHotstar</b></div>
<nav class="g" aria-label="Dock, editing" style="border-radius: 48px; padding: 30px 30px; display: flex; align-items: center; gap: 24px; overflow: visible">
<div class="s" style="transform: rotate(-1.5deg)"><span class="x" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"></path></svg></span><button class="g t" aria-label="Netflix"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><path d="M8 5.5v13l10.5-6.5z"></path></svg></button></div>
<div class="s" style="transform: rotate(1.5deg)"><span class="x" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"></path></svg></span><button class="g t" aria-label="Prime Video"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18M3 15h18M7 5v14M17 5v14"></path></svg></button></div>
<div class="s" style="display: flex; align-items: center; gap: 10px; transform: translateY(-18px)">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
<button class="g t" aria-label="JioHotstar, moving" style="transform: scale(1.14); background: rgba(255,255,255,.32); border: 1px solid rgba(255,255,255,.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.7),0 40px 80px rgba(0,0,0,.55)"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg></button>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</div>
<div class="s" style="transform: rotate(-1.5deg)"><span class="x" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"></path></svg></span><button class="g t" aria-label="YouTube"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="4"></rect><path d="M10 9.5v5l4.5-2.5z"></path></svg></button></div>
<div class="s" style="transform: rotate(1.5deg)"><span class="x" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"></path></svg></span><button class="g t" aria-label="SonyLIV"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.5v7l5.5-3.5z"></path></svg></button></div>
<div class="s" style="transform: rotate(-1.5deg)"><span class="x" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"></path></svg></span><button class="g t" aria-label="Apple TV"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16.5V20"></path></svg></button></div>
<div class="s" style="transform: rotate(1.5deg)"><span class="x" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"></path></svg></span><button class="g t" aria-label="Live TV"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2"></rect><path d="M8 3l4 4 4-4"></path></svg></button></div>
<button aria-label="Add an app to the dock" style="width: 104px; height: 104px; border-radius: 28px; background: transparent; border: 2px dashed rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</nav>
</div>

<div class="g" style="position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); border-radius: 999px; padding: 18px 34px; display: flex; gap: 40px; align-items: center">
<div style="display: flex; gap: 12px; align-items: center"><span class="kk">◀ ▶</span><span class="kv">Move</span></div>
<div style="display: flex; gap: 12px; align-items: center"><span class="kk">OK</span><span class="kv">Drop here</span></div>
<div style="display: flex; gap: 12px; align-items: center"><span class="kk">▼</span><span class="kv">Remove from dock</span></div>
<div style="display: flex; gap: 12px; align-items: center"><span class="kk">Back</span><span class="kv">Done</span></div>
</div>
</div>
</div>

</body>
</html>
