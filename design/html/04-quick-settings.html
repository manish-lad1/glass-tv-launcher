<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick settings</title>

</head>
<body>
<div class="x-dc">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.g{position:relative;overflow:hidden;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(36px) saturate(170%);backdrop-filter:blur(36px) saturate(170%);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 24px 60px rgba(8,6,24,.35)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 42%);pointer-events:none}
.h{font-size:18px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.75)}
.p{border-radius:999px;padding:14px 22px;font-size:22px;font-weight:500;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);color:#fff}
.on{background:rgba(255,255,255,.92);color:#16132e;border-color:#ffffff}
.fo{box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.r{display:flex;align-items:center;gap:18px;width:100%;padding:18px 20px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;text-align:left}
.rt{font-size:23px;font-weight:500}
.rs{font-size:18px;color:rgba(255,255,255,.72)}
button{font:inherit;cursor:pointer}
</style>

<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0b1026; font-family: Inter, system-ui, sans-serif; color: #ffffff">
<svg aria-hidden="true" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%">
<defs>
<linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1026"></stop><stop offset=".42" stop-color="#1c2856"></stop><stop offset=".66" stop-color="#5a447a"></stop><stop offset=".84" stop-color="#d48a6c"></stop><stop offset="1" stop-color="#f0b07a"></stop></linearGradient>
</defs>
<rect width="1920" height="1080" fill="url(#sky4)"></rect>
<path d="M0 700 L180 612 L320 662 L520 540 L700 640 L880 580 L1060 650 L1240 560 L1420 640 L1600 590 L1780 650 L1920 610 L1920 860 L0 860Z" fill="#4a3f6e" opacity=".85"></path>
<path d="M0 770 L240 668 L420 742 L640 642 L860 762 L1080 692 L1300 772 L1520 682 L1740 762 L1920 702 L1920 900 L0 900Z" fill="#2a2350"></path>
<path d="M0 890 L300 802 L560 862 L820 782 L1100 872 L1400 802 L1700 882 L1920 832 L1920 1080 L0 1080Z" fill="#14102b"></path>
</svg>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6,6,20,.5)"></div>

<aside class="g" aria-label="Quick settings" style="position: absolute; top: 48px; right: 48px; bottom: 48px; width: 620px; box-sizing: border-box; border-radius: 48px; padding: 44px 44px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; align-items: center; gap: 18px">
<div style="width: 64px; height: 64px; border-radius: 999px; background: rgba(255,255,255,.9); color: #16132e; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600">M</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 30px; font-weight: 500">Manish</span><span style="font-size: 20px; color: rgba(255,255,255,.75)">9:41 PM · Wi-Fi connected</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<span class="h">Input</span>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><button class="p on">Home</button><button class="p fo">HDMI 1</button><button class="p">HDMI 2</button><button class="p">HDMI 3</button><button class="p">AV</button><button class="p">Antenna</button></div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span class="h">Wallpaper</span><span style="font-size: 18px; color: rgba(255,255,255,.75)">Rotates daily</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<button aria-label="Dusk Ridge, selected" style="height: 92px; border-radius: 18px; padding: 0; border: 3px solid #ffffff; overflow: hidden; background: #1c2856"><svg aria-hidden="true" viewBox="0 0 160 92" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%; display: block"><rect width="160" height="92" fill="#5a447a"></rect><rect width="160" height="40" fill="#1c2856"></rect><path d="M0 60 L40 40 L80 58 L120 38 L160 56 L160 92 L0 92Z" fill="#14102b"></path></svg></button>
<button aria-label="Monsoon Forest" style="height: 92px; border-radius: 18px; padding: 0; border: 1px solid rgba(255,255,255,.3); overflow: hidden; background: #1f3b33"><svg aria-hidden="true" viewBox="0 0 160 92" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%; display: block"><rect width="160" height="92" fill="#2f5a4c"></rect><path d="M0 92 L20 40 L40 92Z M30 92 L55 30 L80 92Z M70 92 L95 44 L120 92Z M110 92 L135 34 L160 92Z" fill="#163029"></path></svg></button>
<button aria-label="Coastal Morning" style="height: 92px; border-radius: 18px; padding: 0; border: 1px solid rgba(255,255,255,.3); overflow: hidden; background: #7aa6c2"><svg aria-hidden="true" viewBox="0 0 160 92" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%; display: block"><rect width="160" height="92" fill="#9cc3d8"></rect><circle cx="116" cy="30" r="12" fill="#fff1cc"></circle><rect y="56" width="160" height="36" fill="#3f7395"></rect></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span class="h">TV settings</span><span style="font-size: 18px; color: rgba(255,255,255,.75)">Opens the TV's own menus</span></div>
<button class="r"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="rt">Picture &amp; brightness</span><span class="rs">Picture mode, backlight, colour</span></span><span aria-hidden="true" style="font-size: 26px; opacity: .7">›</span></button>
<button class="r"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="rt">Sound &amp; Bluetooth</span><span class="rs">Speakers, headphones, sound mode</span></span><span aria-hidden="true" style="font-size: 26px; opacity: .7">›</span></button>
<button class="r"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="rt">Sleep timer</span><span class="rs">Turn the TV off after a set time</span></span><span aria-hidden="true" style="font-size: 26px; opacity: .7">›</span></button>
<button class="r"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="rt">All settings</span><span class="rs">Network, apps, system</span></span><span aria-hidden="true" style="font-size: 26px; opacity: .7">›</span></button>
</div>
</aside>
</div>
</div>

</body>
</html>
